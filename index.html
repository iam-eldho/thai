<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eldhs × Sha — Thailand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#232019;
  --charcoal-soft:#4a453d;
  --paper:#f7f3ea;
  --paper-raised:#fffdf8;
  --sand:#ebe2cd;
  --line:rgba(35,32,25,0.11);
  --green:#3f6b52;
  --green-soft:#e7ede7;
  --terracotta:#b5623f;
  --terracotta-soft:#f3e4dc;
  --muted:#8b8477;
  --radius:20px;
  --radius-sm:12px;
  --shadow:0 1px 2px rgba(35,32,25,0.04), 0 8px 24px rgba(35,32,25,0.05);
  --serif:'Fraunces', serif;
  --sans:'Manrope', sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--charcoal);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

/* ---------- App shell ---------- */
#app{
  display:flex;
  min-height:100vh;
  max-width:1180px;
  margin:0 auto;
}
#sidebar{
  display:none;
  flex-direction:column;
  width:230px;
  flex-shrink:0;
  padding:36px 18px;
  border-right:1px solid var(--line);
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  font-family:var(--serif);
  font-size:19px;
  font-weight:500;
  letter-spacing:0.01em;
  margin-bottom:2px;
}
.brand-sub{
  font-size:12px;
  color:var(--muted);
  margin-bottom:36px;
}
.nav-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:11px 14px;
  border-radius:11px;
  color:var(--charcoal-soft);
  font-size:14.5px;
  font-weight:500;
  border:none;
  background:none;
  width:100%;
  text-align:left;
  transition:background 0.15s ease, color 0.15s ease;
}
.nav-item .sym{font-size:16px; width:18px; text-align:center; opacity:0.85;}
.nav-item:hover{background:var(--sand);}
.nav-item.active{background:var(--charcoal); color:var(--paper-raised);}
.nav-item.active .sym{opacity:1;}

#main{
  flex:1;
  min-width:0;
  padding:0 0 96px 0;
}
.panel{display:none; padding:28px 20px 20px; max-width:640px; margin:0 auto;}
.panel.active{display:block; animation:fadein 0.35s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

@media (min-width:860px){
  #sidebar{display:flex;}
  .panel{padding:48px 40px 48px; max-width:720px;}
  #bottomnav{display:none !important;}
}

/* ---------- Bottom nav (mobile) ---------- */
#bottomnav{
  position:fixed;
  bottom:0; left:0; right:0;
  display:flex;
  background:var(--paper-raised);
  border-top:1px solid var(--line);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index:50;
}
.bn-item{
  flex:1;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; padding:6px 2px;
  color:var(--muted);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:0.02em;
}
.bn-item .sym{font-size:18px; line-height:1;}
.bn-item.active{color:var(--charcoal);}

/* ---------- Typography helpers ---------- */
h1,h2,h3{margin:0; font-family:var(--serif); font-weight:500;}
.eyebrow{
  font-size:11.5px;
  font-weight:700;
  letter-spacing:0.06em;
  color:var(--muted);
  margin:0 0 6px;
}
.section-title{font-family:var(--serif); font-size:22px; font-weight:500; margin:0 0 4px;}
.muted{color:var(--muted);}
.small{font-size:12.5px;}

/* ---------- Cards ---------- */
.card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}
.card + .card{margin-top:14px;}
.stack{display:flex; flex-direction:column; gap:14px;}

/* ---------- Home hero ---------- */
.hero{
  padding-top:8px;
  margin-bottom:26px;
}
.hero-names{
  font-family:var(--serif);
  font-size:15px;
  color:var(--green);
  font-style:italic;
  margin-bottom:10px;
}
.hero-title{
  font-family:var(--serif);
  font-size:38px;
  line-height:1.08;
  font-weight:500;
  margin-bottom:14px;
}
.hero-meta{
  display:flex; align-items:center; gap:10px;
  color:var(--charcoal-soft);
  font-size:14.5px;
  font-weight:500;
}
.hero-meta .dot{width:3px; height:3px; border-radius:50%; background:var(--muted);}
.countdown-card{
  margin-top:18px;
  background:var(--charcoal);
  color:var(--paper-raised);
  border-radius:var(--radius);
  padding:22px 22px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
}
.countdown-num{font-family:var(--serif); font-size:34px; font-weight:500;}
.countdown-label{font-size:13px; color:rgba(247,243,234,0.65); max-width:180px; text-align:right;}

/* ---------- Overview grid ---------- */
.grid4{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px;}
.ov-card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:15px 16px;
}
.ov-label{font-size:11px; font-weight:700; letter-spacing:0.04em; color:var(--muted); margin-bottom:8px;}
.ov-value{font-size:15px; font-weight:600; line-height:1.35;}

/* ---------- Next event ---------- */
.next-card{
  margin-top:22px;
  border-radius:var(--radius);
  border:1px solid var(--line);
  background:var(--green-soft);
  padding:20px;
  position:relative;
}
.next-tag{font-size:11px; font-weight:700; letter-spacing:0.05em; color:var(--green); margin-bottom:10px;}
.next-title{font-family:var(--serif); font-size:22px; font-weight:500; margin-bottom:4px;}
.next-sub{font-size:13.5px; color:var(--charcoal-soft);}

/* ---------- Journey preview ---------- */
.journey{margin-top:26px;}
.journey-list{list-style:none; margin:14px 0 0; padding:0;}
.journey-list li{
  position:relative;
  padding:0 0 26px 26px;
  font-size:15px;
  font-weight:600;
}
.journey-list li::before{
  content:'';
  position:absolute; left:4px; top:6px;
  width:7px; height:7px;
  border-radius:50%;
  background:var(--charcoal);
}
.journey-list li::after{
  content:'';
  position:absolute; left:7px; top:14px; bottom:2px;
  width:1px;
  background:var(--line);
}
.journey-list li:last-child::after{display:none;}
.journey-list li:last-child::before{background:var(--terracotta);}
.journey-list .place-tag{display:block; font-size:11px; font-weight:600; color:var(--muted); margin-top:2px;}

/* ---------- Package snapshot ---------- */
.pkg-card{margin-top:26px;}
.pkg-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0;}
.pkg-row + .pkg-row{border-top:1px solid var(--line);}
.pkg-amt{font-size:18px; font-weight:700;}
.pkg-input{
  width:120px; text-align:right;
  border:1px solid var(--line); border-radius:8px;
  padding:6px 9px; font-size:15px; font-weight:600;
  background:var(--paper); color:var(--charcoal);
}
.quote-note{
  margin-top:14px; padding-top:14px; border-top:1px solid var(--line);
  font-size:12.5px; color:var(--muted); line-height:1.6;
}
.quote-note b{color:var(--charcoal-soft);}

/* ---------- Flights ---------- */
.flight-card{overflow:hidden;}
.flight-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px;}
.flight-route-title{font-family:var(--serif); font-size:19px; font-weight:500;}
.flight-airline{font-size:12.5px; color:var(--muted); margin-top:3px;}
.flight-num{
  font-size:11.5px; font-weight:700; letter-spacing:0.03em;
  background:var(--sand); padding:4px 9px; border-radius:20px;
}
.flight-path{
  display:flex; align-items:center; justify-content:space-between;
  margin:22px 0 18px;
}
.fp-side{text-align:center; width:64px;}
.fp-code{font-family:var(--serif); font-size:26px; font-weight:500;}
.fp-city{font-size:11.5px; color:var(--muted); margin-top:2px;}
.fp-time{font-size:13px; font-weight:700; margin-top:6px;}
.fp-terminal{font-size:10.5px; color:var(--muted);}
.fp-line{
  flex:1; position:relative; height:16px; margin:0 10px;
  display:flex; align-items:center;
}
.fp-line .track{
  position:absolute; left:0; right:0; top:50%; height:1px;
  background:var(--line);
}
.fp-line .plane{
  position:absolute; top:50%; transform:translate(-50%,-50%);
  font-size:14px; color:var(--terracotta);
  animation:fly 5.5s ease-in-out infinite;
}
@keyframes fly{
  0%{left:6%;}
  50%{left:94%;}
  100%{left:6%;}
}
.fp-line.paused .plane{animation-play-state:paused; left:50%;}
.flight-foot{
  display:flex; justify-content:space-between; align-items:center;
  padding-top:14px; border-top:1px solid var(--line);
  font-size:13px;
}
.flight-total{margin-top:14px; text-align:center;}
.flight-total .amt{font-family:var(--serif); font-size:28px; font-weight:500;}
.flight-total-rows{display:flex; justify-content:center; gap:22px; margin-top:8px; font-size:12.5px; color:var(--muted);}

/* ---------- Itinerary ---------- */
.timeline{position:relative; margin-top:18px;}
.day-card{
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--paper-raised);
  margin-bottom:12px;
  overflow:hidden;
}
.day-head{
  width:100%; background:none; border:none;
  display:flex; align-items:center; gap:14px;
  padding:17px 18px;
  text-align:left;
}
.day-num{
  font-family:var(--serif); font-size:22px; font-weight:500; color:var(--muted);
  width:34px; flex-shrink:0;
}
.day-head.done .day-num{color:var(--green);}
.day-headtext{flex:1;}
.day-date{font-size:11px; color:var(--muted); font-weight:600; letter-spacing:0.03em;}
.day-title{font-size:15.5px; font-weight:600; margin-top:2px;}
.day-chevron{font-size:13px; color:var(--muted); transition:transform 0.25s ease;}
.day-card.open .day-chevron{transform:rotate(90deg);}
.day-body{
  max-height:0; overflow:hidden; transition:max-height 0.35s ease;
  padding:0 18px;
}
.day-card.open .day-body{padding-bottom:18px;}
.day-block{margin-top:16px; padding-top:16px; border-top:1px solid var(--line);}
.day-block:first-child{margin-top:2px; padding-top:0; border-top:none;}
.day-block-title{font-size:11.5px; font-weight:700; letter-spacing:0.03em; color:var(--muted); margin-bottom:8px;}
.event-row{display:flex; gap:10px; font-size:13.5px; margin-bottom:6px;}
.event-time{font-weight:700; width:50px; flex-shrink:0; color:var(--charcoal-soft);}
.tag{
  display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:0.03em;
  padding:2px 8px; border-radius:20px; margin-left:8px;
}
.tag.optional{background:var(--terracotta-soft); color:var(--terracotta);}
.tag.free{background:var(--sand); color:var(--charcoal-soft);}

.check-item{
  display:flex; align-items:center; gap:10px;
  padding:8px 0; font-size:14px; cursor:pointer;
  user-select:none;
}
.check-box{
  width:19px; height:19px; border-radius:6px; flex-shrink:0;
  border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  transition:background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  font-size:12px; color:var(--paper-raised);
}
.check-item.checked .check-box{background:var(--green); border-color:var(--green); transform:scale(1.04);}
.check-item.checked .check-label{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line);}
.check-label{flex:1;}

/* ---------- Progress bar ---------- */
.progress-wrap{margin-top:10px;}
.progress-track{height:6px; background:var(--sand); border-radius:20px; overflow:hidden;}
.progress-fill{height:100%; background:var(--green); border-radius:20px; transition:width 0.5s ease;}
.progress-caption{font-size:12px; color:var(--muted); margin-top:8px;}

/* ---------- Stay ---------- */
.stay-card{margin-bottom:14px;}
.stay-top{display:flex; justify-content:space-between; align-items:flex-start;}
.stay-city{font-size:11px; font-weight:700; letter-spacing:0.04em; color:var(--terracotta); margin-bottom:6px;}
.stay-name{font-family:var(--serif); font-size:19px; font-weight:500;}
.stay-alt{font-size:12px; color:var(--muted); margin-top:2px;}
.stay-dates{font-size:13px; margin-top:12px; color:var(--charcoal-soft);}
.confirm-toggle{
  margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:center;
}
.status-pill{
  font-size:12px; font-weight:700; padding:5px 12px; border-radius:20px;
  border:none;
}
.status-pill.no{background:var(--terracotta-soft); color:var(--terracotta);}
.status-pill.yes{background:var(--green-soft); color:var(--green);}

/* ---------- Things to do ---------- */
.todo-progress{margin-bottom:22px;}
.todo-count{font-family:var(--serif); font-size:32px; font-weight:500;}
.todo-add{
  display:flex; gap:8px; margin-top:14px;
}
.todo-add input{
  flex:1; border:1px solid var(--line); border-radius:12px;
  padding:10px 13px; font-size:14px; background:var(--paper-raised);
}
.icon-btn{
  border:1px solid var(--line); background:var(--paper-raised);
  border-radius:12px; width:42px; flex-shrink:0; font-size:18px;
  color:var(--charcoal); display:flex; align-items:center; justify-content:center;
}
.remove-x{background:none; border:none; color:var(--muted); font-size:15px; padding:4px 6px;}

/* ---------- Expenses ---------- */
.exp-dash{margin-bottom:20px;}
.exp-figures{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:16px;}
.exp-fig-label{font-size:10.5px; font-weight:700; color:var(--muted); letter-spacing:0.03em;}
.exp-fig-val{font-size:16px; font-weight:700; margin-top:4px;}
.exp-fig-val.spent{color:var(--terracotta);}
.exp-fig-val.remain{color:var(--green);}
.bar-track{height:10px; border-radius:20px; background:var(--sand); overflow:hidden; display:flex;}
.bar-fill{height:100%; background:var(--terracotta);}
.budget-edit{display:flex; align-items:center; gap:8px; margin-top:14px; font-size:13px; color:var(--muted);}
.budget-edit input{
  border:1px solid var(--line); border-radius:8px; padding:6px 9px;
  width:110px; font-size:13.5px; font-weight:600; background:var(--paper);
}
.cat-row{display:flex; align-items:center; gap:12px; padding:10px 0;}
.cat-row + .cat-row{border-top:1px solid var(--line);}
.cat-sym{
  width:34px; height:34px; border-radius:10px; background:var(--sand);
  display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;
}
.cat-name{font-size:14px; font-weight:600; flex:1;}
.cat-amt{font-size:14px; font-weight:700;}
.exp-entry{display:flex; justify-content:space-between; align-items:center; padding:11px 0;}
.exp-entry + .exp-entry{border-top:1px solid var(--line);}
.exp-entry-desc{font-size:14px; font-weight:600;}
.exp-entry-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
.exp-entry-amt{font-size:14.5px; font-weight:700; margin-right:10px;}
.fab{
  position:fixed; right:20px; bottom:88px; z-index:40;
  background:var(--charcoal); color:var(--paper-raised);
  border:none; border-radius:50px; padding:14px 20px;
  font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px;
  box-shadow:0 8px 22px rgba(35,32,25,0.28);
}
@media (min-width:860px){ .fab{ bottom:40px; } }

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(35,32,25,0.42);
  display:none; align-items:flex-end; justify-content:center;
  z-index:100;
}
.modal-backdrop.open{display:flex;}
@media (min-width:640px){ .modal-backdrop{align-items:center;} }
.modal{
  background:var(--paper-raised); width:100%; max-width:440px;
  border-radius:22px 22px 0 0; padding:26px 22px calc(22px + env(safe-area-inset-bottom));
  max-height:88vh; overflow-y:auto;
  animation:slideup 0.25s ease;
}
@media (min-width:640px){ .modal{border-radius:22px; margin:20px;} }
@keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:none; opacity:1;}}
.modal h3{font-family:var(--serif); font-size:20px; margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:11.5px; font-weight:700; color:var(--muted); letter-spacing:0.03em; margin-bottom:6px;}
.field input, .field select{
  width:100%; border:1px solid var(--line); border-radius:11px;
  padding:11px 13px; font-size:14.5px; background:var(--paper);
}
.seg{display:flex; gap:6px;}
.seg button{
  flex:1; padding:9px 6px; border-radius:10px; border:1px solid var(--line);
  background:var(--paper); font-size:13px; font-weight:600; color:var(--charcoal-soft);
}
.seg button.active{background:var(--charcoal); color:var(--paper-raised); border-color:var(--charcoal);}
.modal-actions{display:flex; gap:10px; margin-top:18px;}
.btn{
  flex:1; padding:13px; border-radius:12px; border:none;
  font-size:14.5px; font-weight:700; text-align:center;
}
.btn.primary{background:var(--charcoal); color:var(--paper-raised);}
.btn.ghost{background:var(--sand); color:var(--charcoal);}
.btn.danger{background:var(--terracotta); color:var(--paper-raised);}

/* ---------- More ---------- */
.more-group{margin-bottom:26px;}
.check-line{
  display:flex; align-items:center; gap:10px; padding:8px 0; font-size:14px;
}
.check-line .m{color:var(--green); width:16px; flex-shrink:0;}
.check-line.x .m{color:var(--terracotta);}
.more-link{
  display:flex; justify-content:space-between; align-items:center;
  width:100%; background:none; border:none; padding:14px 0;
  font-size:14.5px; font-weight:600; color:var(--charcoal);
  border-bottom:1px solid var(--line); text-align:left;
}
.toast{
  position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
  background:var(--charcoal); color:var(--paper-raised);
  padding:11px 18px; border-radius:30px; font-size:13px; font-weight:600;
  z-index:200; opacity:0; pointer-events:none; transition:opacity 0.25s ease, transform 0.25s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
@media (min-width:860px){ .toast{bottom:40px;} }
.file-input{display:none;}
</style>
</head>
<body>

<div id="app">
  <nav id="sidebar">
    <div class="brand">Eldhs × Sha</div>
    <div class="brand-sub">Thailand · 5–9 Oct 2026</div>
    <ul class="nav-list" id="navlist-desktop"></ul>
  </nav>

  <main id="main">
    <section class="panel" data-panel="home"></section>
    <section class="panel" data-panel="flights"></section>
    <section class="panel" data-panel="itinerary"></section>
    <section class="panel" data-panel="todo"></section>
    <section class="panel" data-panel="stay"></section>
    <section class="panel" data-panel="expenses"></section>
    <section class="panel" data-panel="more"></section>
  </main>
</div>

<nav id="bottomnav"></nav>
<button class="fab" id="addExpenseFab" style="display:none;"><span>＋</span>Add expense</button>

<div class="modal-backdrop" id="expenseModalBackdrop">
  <div class="modal">
    <h3>Add expense</h3>
    <div class="field">
      <label>Amount (₹)</label>
      <input type="number" id="expAmount" inputmode="decimal" placeholder="0">
    </div>
    <div class="field">
      <label>Category</label>
      <select id="expCategory"></select>
    </div>
    <div class="field">
      <label>Description</label>
      <input type="text" id="expDesc" placeholder="e.g. Tuk-tuk to hotel">
    </div>
    <div class="field">
      <label>Date</label>
      <input type="date" id="expDate">
    </div>
    <div class="field">
      <label>Paid by</label>
      <div class="seg" id="expPaidBy">
        <button data-v="Eldhs">Eldhs</button>
        <button data-v="Sha">Sha</button>
        <button data-v="Both" class="active">Both</button>
      </div>

/* ============================================================
   TINY INDEXEDDB KEY/VALUE STORE
============================================================ */
const DB_NAME = "eldhs-sha-thailand";
const STORE = "kv";
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ resolve(null); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> resolve(null);
  });
  return dbPromise;
}
async function idbGet(key, fallback){
  try{
    const db = await openDB();
    if(!db) return fallback;
    return await new Promise((resolve)=>{
      const tx = db.transaction(STORE,"readonly");
      const req = tx.objectStore(STORE).get(key);
      req.onsuccess = ()=> resolve(req.result === undefined ? fallback : req.result);
      req.onerror = ()=> resolve(fallback);
    });
  }catch(e){ return fallback; }
}
async function idbSet(key, value){
  try{
    const db = await openDB();
    if(!db) return false;
    return await new Promise((resolve)=>{
      const tx = db.transaction(STORE,"readwrite");
      tx.objectStore(STORE).put(value, key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> resolve(false);
    });
  }catch(e){ return false; }
}
async function idbGetAllKV(){
  try{
    const db = await openDB();
    if(!db) return {};
    return await new Promise((resolve)=>{
      const tx = db.transaction(STORE,"readonly");
      const store = tx.objectStore(STORE);
      const out = {};
      const cursorReq = store.openCursor();
      cursorReq.onsuccess = (e)=>{
        const cur = e.target.result;
        if(cur){ out[cur.key] = cur.value; cur.continue(); }
        else resolve(out);
      };
      cursorReq.onerror = ()=> resolve(out);
    });
  }catch(e){ return {}; }
}
async function idbClearAll(){
  try{
    const db = await openDB();
    if(!db) return false;
    return await new Promise((resolve)=>{
      const tx = db.transaction(STORE,"readwrite");
      tx.objectStore(STORE).clear();
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> resolve(false);
    });
  }catch(e){ return false; }
}

/* ============================================================

============================================================ */
function dayIndexFromNow(){
  const start = new Date(TRIP.dateStart+"T00:00:00");
  const end = new Date(TRIP.dateEnd+"T23:59:59");
  const now = new Date();
  if(now < start) return -1;
  if(now > end) return 99;
  const diff = Math.floor((now - new Date(start.getFullYear(),start.getMonth(),start.getDate())) / 86400000);
  return diff + 1; // 1..5
}
function daysUntilStart(){
  const start = new Date(TRIP.dateStart+"T00:00:00");
  const now = new Date();
  const diff = Math.ceil((start - now) / 86400000);
  return diff;
}

function computeNextEvent(dIdx){
  if(dIdx === -1){
    const f = TRIP.flights.outbound;
    return { title: `✈ ${f.num}`, sub: `Bengaluru → Bangkok · ${f.date.slice(0,2)} Oct · ${f.from.time}` };
  }

    for(let i = dIdx-1; i < TRIP.days.length; i++){
      const day = TRIP.days[i];
      const item = day.checklist.find(c => !state.checklist[c.id]);
      if(item){
        return { title: item.label, sub: `Day ${day.num} · ${day.place}` };
      }
    }
    return { title: "Return flight", sub: `FD-170 · Bangkok → Kochi · 20:15` };
  }
  return { title: "Trip completed", sub: "Hope it was unforgettable — check Expenses for the final tally." };
}

let flightObserver = null;
function armFlightAnimations(){
  if(flightObserver) flightObserver.disconnect();
  flightObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      const line = entry.target.querySelector(".fp-line");
      if(!line) return;
      if(entry.isIntersecting) line.classList.remove("paused");
      else line.classList.add("paused");
    });
  }, {threshold:0.4});
  document.querySelectorAll(".flight-card").forEach(c=> flightObserver.observe(c));
}

      renderItinerary();
      requestAnimationFrame(setDayBodyHeights);
    });
  });
  wrap.querySelectorAll("[data-check]").forEach(row=>{
    row.addEventListener("click", async ()=>{
      const id = row.getAttribute("data-check");
      state.checklist[id] = !state.checklist[id];
      await persist("checklist");
      renderItinerary();
      requestAnimationFrame(setDayBodyHeights);
    });
  });
  requestAnimationFrame(setDayBodyHeights);
}
function setDayBodyHeights(){
  document.querySelectorAll(".day-card").forEach(card=>{
    const body = card.querySelector(".day-body");
    if(card.classList.contains("open")){
      body.style.maxHeight = body.scrollHeight + "px";
    } else {
      body.style.maxHeight = "0px";
    }
  });
}

/* ============================================================
   RENDER: THINGS TO DO
============================================================ */
function renderTodo(){
  const el = document.querySelector('[data-panel="todo"]');
  const totalItems = TRIP.packageActivities.length + state.personalTodos.length;
  const doneItems = TRIP.packageActivities.filter(a=>state.packageActivityDone[a.id]).length
    + state.personalTodos.filter(t=>t.done).length;

  el.innerHTML = `
    <div class="eyebrow">Things to do</div>
    <h2 class="section-title">What we want to experience</h2>
    <div class="todo-progress">
      <div class="todo-count">${doneItems} / ${totalItems} completed</div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${totalItems? (doneItems/totalItems*100):0}%;"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">Package activities</div>
      ${TRIP.packageActivities.map(a=>`
        <div class="check-item ${state.packageActivityDone[a.id]?'checked':''}" data-pa="${a.id}">
          <span class="check-box">${state.packageActivityDone[a.id]?'✓':''}</span>
          <span class="check-label">${a.label}</span>
        </div>
      `).join("")}
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="eyebrow">Our own plans</div>
      ${state.personalTodos.map(t=>`
        <div class="check-item ${t.done?'checked':''}" data-todo="${t.id}" style="position:relative;">
          <span class="check-box">${t.done?'✓':''}</span>
          <span class="check-label">${t.label}</span>
          <button class="remove-x" data-remove="${t.id}">×</button>
        </div>
      `).join("")}
      <div class="todo-add">
        <input type="text" id="newTodoInput" placeholder="Add something we want to do">
        <button class="icon-btn" id="newTodoBtn">＋</button>
      </div>
    </div>
  `;

  el.querySelectorAll("[data-pa]").forEach(row=>{
    row.addEventListener("click", async (e)=>{
      if(e.target.closest("[data-remove]")) return;
      const id = row.getAttribute("data-pa");
      state.packageActivityDone[id] = !state.packageActivityDone[id];
      await persist("packageActivityDone");
      renderTodo();
    });
  });
  el.querySelectorAll("[data-todo]").forEach(row=>{
    row.addEventListener("click", async (e)=>{
      if(e.target.closest("[data-remove]")) return;
      const id = row.getAttribute("data-todo");
      const t = state.personalTodos.find(x=>x.id===id);
      t.done = !t.done;
      await persist("personalTodos");
      renderTodo();
    });
  });
  el.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", async (e)=>{
      e.stopPropagation();
      const id = btn.getAttribute("data-remove");
      state.personalTodos = state.personalTodos.filter(x=>x.id!==id);
      await persist("personalTodos");
      renderTodo();
    });
  });
  const addNew = async ()=>{
    const input = document.getElementById("newTodoInput");
    const val = input.value.trim();
    if(!val) return;
    state.personalTodos.push({id:uid(), label:val, done:false});
    await persist("personalTodos");
    renderTodo();
  };
  document.getElementById("newTodoBtn").addEventListener("click", addNew);
  document.getElementById("newTodoInput").addEventListener("keydown", (e)=>{
    if(e.key === "Enter") addNew();
  });
}

/* ============================================================
   RENDER: EXPENSES
============================================================ */
function renderExpenses(){
  const el = document.querySelector('[data-panel="expenses"]');
  const spent = state.expenses.reduce((s,e)=>s+e.amount,0);
  const remaining = state.budget - spent;
  const pct = state.budget>0 ? Math.min(100, (spent/state.budget*100)) : 0;

  const catTotals = TRIP.expenseCategories.map(c=>{
    const total = state.expenses.filter(e=>e.category===c.key).reduce((s,e)=>s+e.amount,0);
    return {...c, total};
  }).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);

  const entries = [...state.expenses].sort((a,b)=> (b.date||"").localeCompare(a.date||""));

  el.innerHTML = `
    <div class="eyebrow">Expenses</div>
    <h2 class="section-title" style="margin-bottom:18px;">Where our money is going</h2>

    <div class="card exp-dash">
      <div class="exp-figures">
        <div><div class="exp-fig-label">Budget</div><div class="exp-fig-val">${fmtINR(state.budget)}</div></div>
        <div><div class="exp-fig-label">Spent</div><div class="exp-fig-val spent">${fmtINR(spent)}</div></div>
        <div><div class="exp-fig-label">Remaining</div><div class="exp-fig-val remain">${fmtINR(remaining)}</div></div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
      <div class="budget-edit">
        <span>Budget</span>
        <input type="number" id="budgetInput" value="${state.budget}" inputmode="decimal">
      </div>
    </div>

    ${catTotals.length ? `
    <div class="card" style="margin-top:14px;">
      <div class="eyebrow">By category</div>
      ${catTotals.map(c=>`
        <div class="cat-row">
          <div class="cat-sym">${c.sym}</div>
          <div class="cat-name">${c.label}</div>
          <div class="cat-amt">${fmtINR(c.total)}</div>
        </div>
      `).join("")}
    </div>` : ""}

    <div class="card" style="margin-top:14px;">
      <div class="eyebrow">All expenses</div>
      ${entries.length ? entries.map(e=>{
        const cat = TRIP.expenseCategories.find(c=>c.key===e.category);
        return `
        <div class="exp-entry">
          <div>
            <div class="exp-entry-desc">${e.desc || cat?.label || "Expense"}</div>
            <div class="exp-entry-meta">${cat?.label||""} · ${e.date||""} · ${e.paidBy}</div>
          </div>
          <div style="display:flex; align-items:center;">
            <span class="exp-entry-amt">${fmtINR(e.amount)}</span>
            <button class="remove-x" data-delexp="${e.id}">×</button>
          </div>
        </div>`;
      }).join("") : `<div class="muted small">No expenses logged yet.</div>`}
    </div>
  `;

  document.getElementById("budgetInput").addEventListener("change", async (e)=>{
    state.budget = parseFloat(e.target.value) || 0;
    await persist("budget");
    renderExpenses();
  });
  el.querySelectorAll("[data-delexp]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const id = btn.getAttribute("data-delexp");
      state.expenses = state.expenses.filter(x=>x.id!==id);
      await persist("expenses");
      renderExpenses();
      toast("Expense removed");
    });
  });
}

/* ---------- Export / Import / Reset ---------- */
function exportData(){
  const payload = {
    exportedAt: new Date().toISOString(),
    checklist: state.checklist,
    packageActivityDone: state.packageActivityDone,
    personalTodos: state.personalTodos,
    hotelConfirmed: state.hotelConfirmed,
    pendingAmount: state.pendingAmount,
    budget: state.budget,
    expenses: state.expenses
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "eldhs-sha-thailand-2026.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast("Trip data exported");
}
async function importData(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(data.checklist) state.checklist = data.checklist;
    if(data.packageActivityDone) state.packageActivityDone = data.packageActivityDone;
    if(data.personalTodos) state.personalTodos = data.personalTodos;
    if(data.hotelConfirmed) state.hotelConfirmed = data.hotelConfirmed;
    if(typeof data.pendingAmount === "number") state.pendingAmount = data.pendingAmount;
    if(typeof data.budget === "number") state.budget = data.budget;
    if(data.expenses) state.expenses = data.expenses;
    await Promise.all(["checklist","packageActivityDone","personalTodos","hotelConfirmed","pendingAmount","budget","expenses"].map(persist));
    renderAll();
    toast("Trip data imported");
  }catch(e){
    toast("Couldn't read that file");
  }
}
async function resetAllData(){
  await idbClearAll();
  state = {
    checklist:{}, packageActivityDone:{}, personalTodos:[], hotelConfirmed:{},
    pendingAmount: 35298, budget: 150000, expenses: []
  };
  await loadState();
  renderAll();
  toast("Trip data reset");
}

});

    document.querySelectorAll("#expPaidBy button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
  });
});
document.querySelectorAll("#expMethod button").forEach(b=>{
  b.addEventListener("click", ()=>{
    document.querySelectorAll("#expMethod button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
  });
});
document.getElementById("expSave").addEventListener("click", async ()=>{
  const amount = parseFloat(document.getElementById("expAmount").value);
  if(!amount || amount<=0){ toast("Enter a valid amount"); return; }
  const category = document.getElementById("expCategory").value;
  const desc = document.getElementById("expDesc").value.trim();
  const date = document.getElementById("expDate").value;
  const paidBy = document.querySelector("#expPaidBy button.active").dataset.v;
  const method = document.querySelector("#expMethod button.active").dataset.v;
  state.expenses.push({id:uid(), amount, category, desc, date, paidBy, method});
  await persist("expenses");
  closeExpenseModal();
  renderExpenses();
  toast("Expense added");
});

document.getElementById("resetCancel").addEventListener("click", ()=>{
  document.getElementById("resetModalBackdrop").classList.remove("open");
});
document.getElementById("resetConfirm").addEventListener("click", async ()=>{
  document.getElementById("resetModalBackdrop").classList.remove("open");
  await resetAllData();
});
document.getElementById("importFile").addEventListener("change", (e)=>{
  const f = e.target.files[0];
  if(f) importData(f);
  e.target.value = "";
});

window.addEventListener("resize", ()=> requestAnimationFrame(setDayBodyHeights));

(async function init(){
  await loadState();
  renderAll();
})();
</script>
